<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logrift</title>
  <style>
    :root {
      --bg: #0f141b;
      --panel: #161d27;
      --panel-2: #1d2733;
      --border: #263241;
      --text: #d7e0ea;
      --muted: #8494a7;
      --accent: #5aa9ff;
      --trace: #8494a7;
      --debug: #6fb3d2;
      --info: #4fb477;
      --warn: #d9a441;
      --error: #e06a5f;
      --fatal: #c065d6;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--panel); position: sticky; top: 0; z-index: 10;
    }
    header h1 { margin: 0; font-size: 16px; letter-spacing: .3px; }
    header h1 span { color: var(--accent); }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
    .stat {
      font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .5px;
      color: var(--muted); background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 9px;
    }
    .stat b { color: var(--text); font-size: 12px; }
    .stat.error b { color: var(--error); }
    .stat.warn b { color: var(--warn); }
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
      position: sticky; top: 57px; z-index: 9;
    }
    .controls input, .controls select {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 9px; font: inherit; outline: none;
    }
    .controls input:focus, .controls select:focus { border-color: var(--accent); }
    #q { min-width: 260px; flex: 1 1 260px; font-family: var(--mono); }
    button {
      background: var(--accent); color: #06121f; border: 0; border-radius: 6px;
      padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
    main { padding: 0 20px 60px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
      vertical-align: top; overflow: hidden; text-overflow: ellipsis;
    }
    th {
      position: sticky; top: 118px; background: var(--bg); z-index: 8;
      font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    }
    th.time, td.time { width: 185px; white-space: nowrap; font-family: var(--mono); color: var(--muted); }
    th.level, td.level { width: 74px; }
    th.service, td.service { width: 130px; color: var(--muted); }
    td.msg { font-family: var(--mono); white-space: pre-wrap; word-break: break-word; }
    tr.entry { cursor: pointer; }
    tr.entry:hover td { background: var(--panel); }
    .badge {
      display: inline-block; font: 11px/1.6 var(--mono); text-transform: uppercase;
      padding: 1px 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border);
    }
    .badge.trace { color: var(--trace); } .badge.debug { color: var(--debug); }
    .badge.info { color: var(--info); } .badge.warn { color: var(--warn); }
    .badge.error { color: var(--error); } .badge.fatal { color: var(--fatal); }
    tr.detail td { background: var(--panel); }
    tr.detail pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 var(--mono); color: var(--text); }
    .empty { padding: 40px 10px; color: var(--muted); text-align: center; }
    footer { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: var(--muted); }
    #status.error { color: var(--error); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1><span>log</span>rift</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="Search messages and attributes…" autocomplete="off" />
    <select id="level">
      <option value="">All levels</option>
      <option>trace</option><option>debug</option><option>info</option>
      <option>warn</option><option>error</option><option>fatal</option>
    </select>
    <input id="service" type="search" placeholder="Service" style="width: 140px" autocomplete="off" />
    <select id="since">
      <option value="15m">Last 15m</option>
      <option value="1h">Last hour</option>
      <option value="6h">Last 6 hours</option>
      <option value="24h" selected>Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="">All time</option>
    </select>
    <select id="limit">
      <option>50</option><option selected>100</option><option>250</option><option>500</option>
    </select>
    <button id="apply">Search</button>
    <label class="toggle"><input id="live" type="checkbox" /> Live</label>
    <span id="status"></span>
  </div>

  <main>
    <table>
      <thead>
        <tr><th class="time">Time</th><th class="level">Level</th><th class="service">Service</th><th>Message</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <button id="prev" class="secondary">← Newer</button>
    <button id="next" class="secondary">Older →</button>
    <span id="page"></span>
  </footer>

  <script>
    const state = { offset: 0, total: 0, maxLimit: 1000 };
    const $ = id => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function fmtTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const p = n => String(n).padStart(2, "0");
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`;
    }

    function params() {
      const p = new URLSearchParams();
      const q = $("q").value.trim();
      if (q) p.set("q", q);
      if ($("level").value) p.set("level", $("level").value);
      if ($("service").value.trim()) p.set("service", $("service").value.trim());
      if ($("since").value) p.set("since", $("since").value);
      p.set("limit", $("limit").value);
      p.set("offset", state.offset);
      return p;
    }

    async function load() {
      try {
        const res = await fetch("/api/search?" + params());
        if (!res.ok) throw new Error("server returned " + res.status);
        const data = await res.json();
        state.total = data.total;
        render(data.entries, data.limit, data.offset);
        $("status").textContent = new Date().toLocaleTimeString();
        $("status").classList.remove("error");
      } catch (err) {
        $("status").textContent = "Error: " + err.message;
        $("status").classList.add("error");
      }
      loadStats();
    }

    function render(entries, limit, offset) {
      const rows = $("rows");
      if (!entries.length) {
        rows.innerHTML = '<tr><td colspan="4" class="empty">No matching logs.</td></tr>';
      } else {
        rows.innerHTML = entries.map((e, i) => {
          const msg = e.message || "";
          return `<tr class="entry" data-i="${i}">` +
            `<td class="time">${esc(fmtTime(e.time))}</td>` +
            `<td class="level"><span class="badge ${esc(e.level)}">${esc(e.level)}</span></td>` +
            `<td class="service">${esc(e.service || "—")}</td>` +
            `<td class="msg">${esc(msg)}</td></tr>` +
            `<tr class="detail" data-i="${i}" hidden><td colspan="4"><pre>${esc(JSON.stringify(e, null, 2))}</pre></td></tr>`;
        }).join("");
        rows.querySelectorAll("tr.entry").forEach(row => row.addEventListener("click", () => {
          const detail = rows.querySelector('tr.detail[data-i="' + row.dataset.i + '"]');
          detail.hidden = !detail.hidden;
        }));
      }
      const from = state.total === 0 ? 0 : offset + 1;
      const to = Math.min(offset + limit, state.total);
      $("page").textContent = `${from}–${to} of ${state.total}`;
      $("prev").disabled = offset <= 0;
      $("next").disabled = offset + limit >= state.total;
    }

    async function loadStats() {
      try {
        const res = await fetch("/api/stats");
        const data = await res.json();
        const parts = [`<div class="stat">total <b>${data.total}</b></div>`];
        for (const [level, count] of Object.entries(data.levels)) {
          const cls = level === "error" || level === "fatal" ? " error" : level === "warn" ? " warn" : "";
          parts.push(`<div class="stat${cls}">${level} <b>${count}</b></div>`);
        }
        $("stats").innerHTML = parts.join("");
      } catch { /* stats are best-effort */ }
    }

    $("apply").addEventListener("click", () => { state.offset = 0; load(); });
    $("q").addEventListener("keydown", e => { if (e.key === "Enter") { state.offset = 0; load(); } });
    ["level", "service", "since", "limit"].forEach(id => $(id).addEventListener("change", () => { state.offset = 0; load(); }));
    $("prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - Number($("limit").value)); load(); });
    $("next").addEventListener("click", () => { state.offset += Number($("limit").value); load(); });

    let timer = null;
    $("live").addEventListener("change", () => {
      if (timer) { clearInterval(timer); timer = null; }
      if ($("live").checked) { state.offset = 0; load(); timer = setInterval(load, 3000); }
    });

    load();
  </script>
</body>
</html>
