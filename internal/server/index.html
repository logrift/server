<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logrift</title>
  <style>
    :root {
      --bg: #0f141b; --panel: #161d27; --panel-2: #1d2733; --border: #263241;
      --text: #d7e0ea; --muted: #8494a7; --accent: #5aa9ff;
      --trace: #8494a7; --debug: #6fb3d2; --info: #4fb477; --warn: #d9a441;
      --error: #e06a5f; --fatal: #c065d6;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0; font-size: 16px; letter-spacing: .3px; }
    header h1 span { color: var(--accent); }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .stat { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; }
    .stat b { color: var(--text); font-size: 12px; }
    .stat.error b { color: var(--error); } .stat.warn b { color: var(--warn); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 57px; z-index: 9; }
    input, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font: inherit; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    #q { min-width: 220px; flex: 1 1 220px; font-family: var(--mono); }
    button { background: var(--accent); color: #06121f; border: 0; border-radius: 6px; padding: 7px 13px; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    button.danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
    button.small { padding: 4px 9px; font-size: 12px; }
    label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
    main { padding: 0 20px 60px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow: hidden; text-overflow: ellipsis; }
    th { position: sticky; top: 118px; background: var(--bg); z-index: 8; font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    th.time, td.time { width: 178px; white-space: nowrap; font-family: var(--mono); color: var(--muted); }
    th.project, td.project { width: 110px; }
    th.level, td.level { width: 72px; }
    th.service, td.service { width: 120px; color: var(--muted); }
    td.msg { font-family: var(--mono); white-space: pre-wrap; word-break: break-word; }
    tr.entry { cursor: pointer; } tr.entry:hover td { background: var(--panel); }
    .badge { display: inline-block; font: 11px/1.6 var(--mono); text-transform: uppercase; padding: 1px 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); }
    .badge.trace { color: var(--trace); } .badge.debug { color: var(--debug); } .badge.info { color: var(--info); }
    .badge.warn { color: var(--warn); } .badge.error { color: var(--error); } .badge.fatal { color: var(--fatal); }
    .badge.project { color: var(--accent); text-transform: none; }
    tr.detail td { background: var(--panel); }
    tr.detail pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 var(--mono); }
    .empty { padding: 40px 10px; color: var(--muted); text-align: center; }
    footer { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: var(--muted); }
    #status.error { color: var(--error); }
    a { color: var(--accent); }
    .panel { border-bottom: 1px solid var(--border); background: var(--panel); padding: 16px 20px; }
    .panel h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .panel-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .project-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .project-item { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); }
    .project-item .name { font-weight: 600; min-width: 120px; }
    .project-item .meta { color: var(--muted); font: 11px/1.6 var(--mono); }
    .project-item .spacer { margin-left: auto; }
    .keybox { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 6px; background: rgba(90,169,255,.08); }
    .keybox code { font-family: var(--mono); word-break: break-all; }
    .hint { color: var(--muted); font-size: 12px; }
    #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 100; }
    #login .card { width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
    #login h1 { margin: 0 0 4px; font-size: 20px; }
    #login p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
    #login input { width: 100%; margin-bottom: 12px; }
    #login button { width: 100%; }
    #login .error { color: var(--error); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h1><span style="color:var(--accent)">log</span>rift</h1>
      <p>Enter the admin key to view and manage projects.</p>
      <input id="loginKey" type="password" placeholder="Admin key" autocomplete="off" />
      <div class="error" id="loginError"></div>
      <button id="loginBtn">Unlock</button>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <h1><span>log</span>rift</h1>
      <select id="projectSelect" title="Project"></select>
      <button id="manageBtn" class="secondary small">Manage projects</button>
      <button id="logoutBtn" class="secondary small">Lock</button>
      <div class="stats" id="stats"></div>
    </header>

    <div class="controls">
      <input id="q" type="search" placeholder="Search messages and attributes…" autocomplete="off" />
      <select id="level">
        <option value="">All levels</option>
        <option>trace</option><option>debug</option><option>info</option>
        <option>warn</option><option>error</option><option>fatal</option>
      </select>
      <input id="service" type="search" placeholder="Service" style="width: 130px" autocomplete="off" />
      <select id="since">
        <option value="15m">Last 15m</option>
        <option value="1h">Last hour</option>
        <option value="6h">Last 6 hours</option>
        <option value="24h" selected>Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="">All time</option>
      </select>
      <select id="limit"><option>50</option><option selected>100</option><option>250</option><option>500</option></select>
      <button id="apply">Search</button>
      <label class="toggle"><input id="live" type="checkbox" /> Live</label>
      <span id="status"></span>
    </div>

    <div class="panel" id="projectsPanel" hidden>
      <h2>Projects</h2>
      <div class="project-list" id="projectList"></div>
      <div class="panel-row">
        <input id="newProjectName" placeholder="project-name" autocomplete="off" />
        <input id="newProjectDesc" placeholder="Description (optional)" autocomplete="off" style="min-width: 220px" />
        <button id="createProject">Create project</button>
      </div>
      <div class="keybox" id="keybox" hidden>
        <div class="hint">Copy this key now — it is shown only once.</div>
        <code id="keyValue"></code>
        <button id="copyKey" class="secondary small">Copy</button>
      </div>
    </div>

    <main>
      <table>
        <thead><tr><th class="time">Time</th><th class="project">Project</th><th class="level">Level</th><th class="service">Service</th><th>Message</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </main>
    <footer>
      <button id="prev" class="secondary">← Newer</button>
      <button id="next" class="secondary">Older →</button>
      <span id="page"></span>
    </footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const state = { adminKey: localStorage.getItem("logrift_admin_key") || "", project: "all", offset: 0, total: 0, projects: [] };

    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function fmtTime(iso) { const d = new Date(iso); if (isNaN(d)) return iso; const p = n => String(n).padStart(2, "0"); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,"0")}`; }
    function authHeaders() { return { Authorization: "Bearer " + state.adminKey }; }

    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
      if (res.status === 401) { lock(); throw new Error("unauthorized"); }
      return res;
    }

    function lock() { localStorage.removeItem("logrift_admin_key"); state.adminKey = ""; $("app").hidden = true; $("login").hidden = false; }
    function unlock() { $("login").hidden = true; $("app").hidden = false; $("loginError").textContent = ""; init(); }

    async function tryUnlock(key) {
      const res = await fetch("/api/projects", { headers: { Authorization: "Bearer " + key } });
      if (!res.ok) { $("loginError").textContent = "Invalid admin key"; return; }
      state.adminKey = key; localStorage.setItem("logrift_admin_key", key); unlock();
    }
    $("loginBtn").addEventListener("click", () => tryUnlock($("loginKey").value.trim()));
    $("loginKey").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock($("loginKey").value.trim()); });
    $("logoutBtn").addEventListener("click", lock);

    function params() {
      const p = new URLSearchParams();
      p.set("project", state.project);
      const q = $("q").value.trim();
      if (q) p.set("q", q);
      if ($("level").value) p.set("level", $("level").value);
      if ($("service").value.trim()) p.set("service", $("service").value.trim());
      if ($("since").value) p.set("since", $("since").value);
      p.set("limit", $("limit").value);
      p.set("offset", state.offset);
      return p;
    }

    async function load() {
      try {
        const res = await api("/api/search?" + params());
        if (!res.ok) throw new Error("server returned " + res.status);
        const data = await res.json();
        state.total = data.total;
        render(data.entries, data.limit, data.offset);
        $("status").textContent = new Date().toLocaleTimeString();
        $("status").classList.remove("error");
      } catch (err) {
        $("status").textContent = "Error: " + err.message;
        $("status").classList.add("error");
      }
    }

    function render(entries, limit, offset) {
      entries = entries || [];
      const rows = $("rows");
      if (!entries.length) {
        rows.innerHTML = '<tr><td colspan="5" class="empty">No matching logs.</td></tr>';
      } else {
        rows.innerHTML = entries.map((e, i) =>
          `<tr class="entry" data-i="${i}">` +
          `<td class="time">${esc(fmtTime(e.time))}</td>` +
          `<td class="project"><span class="badge project">${esc(e.project || "—")}</span></td>` +
          `<td class="level"><span class="badge ${esc(e.level)}">${esc(e.level)}</span></td>` +
          `<td class="service">${esc(e.service || "—")}</td>` +
          `<td class="msg">${esc(e.message || "")}</td></tr>` +
          `<tr class="detail" data-i="${i}" hidden><td colspan="5"><pre>${esc(JSON.stringify(e, null, 2))}</pre></td></tr>`
        ).join("");
        rows.querySelectorAll("tr.entry").forEach(row => row.addEventListener("click", () => {
          const detail = rows.querySelector('tr.detail[data-i="' + row.dataset.i + '"]');
          detail.hidden = !detail.hidden;
        }));
      }
      const from = state.total === 0 ? 0 : offset + 1;
      const to = Math.min(offset + limit, state.total);
      $("page").textContent = state.total > limit ? `${from}–${to} of ${state.total} (top ${Math.min(state.total, limit + offset)})` : `${state.total} entries`;
      $("prev").disabled = offset <= 0;
      $("next").disabled = offset + limit >= state.total;
    }

    function aggregateStats() {
      const levels = { trace: 0, debug: 0, info: 0, warn: 0, error: 0, fatal: 0 };
      let total = 0;
      const selected = state.project === "all" ? state.projects : state.projects.filter(p => p.name === state.project);
      for (const p of selected) {
        total += p.total || 0;
        for (const k of Object.keys(levels)) levels[k] += (p.levels && p.levels[k]) || 0;
      }
      const parts = [`<div class="stat">total <b>${total}</b></div>`];
      for (const [level, count] of Object.entries(levels)) {
        const cls = level === "error" || level === "fatal" ? " error" : level === "warn" ? " warn" : "";
        parts.push(`<div class="stat${cls}">${level} <b>${count}</b></div>`);
      }
      $("stats").innerHTML = parts.join("");
    }

    async function refreshProjects() {
      try {
        const res = await api("/api/projects");
        if (!res.ok) return;
        const data = await res.json();
        state.projects = data.projects || [];
        const select = $("projectSelect");
        const current = state.project;
        select.innerHTML = `<option value="all">All projects (${state.projects.length})</option>` +
          state.projects.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
        select.value = state.projects.some(p => p.name === current) ? current : "all";
        state.project = select.value;
        aggregateStats();
        renderProjectList();
      } catch { /* best effort */ }
    }

    function renderProjectList() {
      const list = $("projectList");
      if (!state.projects.length) { list.innerHTML = '<div class="hint">No projects yet. Create one below.</div>'; return; }
      list.innerHTML = state.projects.map(p =>
        `<div class="project-item" data-name="${esc(p.name)}">` +
        `<span class="name">${esc(p.name)}</span>` +
        `<span class="meta">key ${esc(p.key_prefix)}… · ${p.total} entries · used ${p.last_used_at ? esc(fmtTime(p.last_used_at)) : "never"}</span>` +
        `<span class="spacer"></span>` +
        `<button class="secondary small" data-action="rotate">Rotate key</button>` +
        `<button class="danger small" data-action="delete">Delete</button>` +
        `</div>`).join("");
      list.querySelectorAll("button[data-action]").forEach(btn => btn.addEventListener("click", () => {
        const name = btn.closest(".project-item").dataset.name;
        if (btn.dataset.action === "rotate") rotateProject(name);
        else deleteProject(name);
      }));
    }

    function showKey(key) {
      $("keyValue").textContent = key;
      $("keybox").hidden = false;
    }

    async function createProject() {
      const name = $("newProjectName").value.trim();
      if (!name) return;
      const res = await api("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, description: $("newProjectDesc").value.trim() }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { alert(data.error || "Unable to create project"); return; }
      $("newProjectName").value = ""; $("newProjectDesc").value = "";
      showKey(data.key);
      await refreshProjects();
    }

    async function rotateProject(name) {
      if (!confirm(`Rotate the API key for "${name}"? The old key will stop working.`)) return;
      const res = await api(`/api/projects/${encodeURIComponent(name)}/rotate`, { method: "POST" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { alert(data.error || "Unable to rotate key"); return; }
      showKey(data.key);
      await refreshProjects();
    }

    async function deleteProject(name) {
      if (!confirm(`Delete project "${name}" and all of its logs? This cannot be undone.`)) return;
      const res = await api(`/api/projects/${encodeURIComponent(name)}`, { method: "DELETE" });
      if (!res.ok) { const data = await res.json().catch(() => ({})); alert(data.error || "Unable to delete project"); return; }
      $("keybox").hidden = true;
      await refreshProjects();
      load();
    }

    $("manageBtn").addEventListener("click", () => { $("projectsPanel").hidden = !$("projectsPanel").hidden; });
    $("createProject").addEventListener("click", createProject);
    $("copyKey").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("keyValue").textContent); $("copyKey").textContent = "Copied"; setTimeout(() => $("copyKey").textContent = "Copy", 1200); } catch {} });
    $("projectSelect").addEventListener("change", () => { state.project = $("projectSelect").value; state.offset = 0; aggregateStats(); load(); });
    $("apply").addEventListener("click", () => { state.offset = 0; load(); });
    $("q").addEventListener("keydown", e => { if (e.key === "Enter") { state.offset = 0; load(); } });
    ["level", "service", "since", "limit"].forEach(id => $(id).addEventListener("change", () => { state.offset = 0; load(); }));
    $("prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - Number($("limit").value)); load(); });
    $("next").addEventListener("click", () => { state.offset += Number($("limit").value); load(); });

    let timer = null;
    $("live").addEventListener("change", () => {
      if (timer) { clearInterval(timer); timer = null; }
      if ($("live").checked) { state.offset = 0; load(); refreshProjects(); timer = setInterval(() => { load(); refreshProjects(); }, 5000); }
    });

    async function init() { await refreshProjects(); await load(); }
    setInterval(() => { if (!$("app").hidden) refreshProjects(); }, 30000);

    if (state.adminKey) {
      fetch("/api/projects", { headers: { Authorization: "Bearer " + state.adminKey } })
        .then(res => res.ok ? unlock() : lock())
        .catch(lock);
    } else {
      $("login").hidden = false;
    }
  </script>
</body>
</html>
